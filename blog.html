<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.feed-wrap{max-width:700px;}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:16px;}
.filter-label{font-family:var(--font-mono);font-size:7px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;}
.search-input{font-family:var(--font-mono);font-size:8px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;color:var(--text-muted);outline:none;margin-left:auto;width:140px;}
.results-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.results-count{font-family:var(--font-mono);font-size:7px;color:var(--text-dim);}
.results-count span{color:var(--text-muted);}
.sort-btn{font-family:var(--font-mono);font-size:7px;color:var(--text-dim);cursor:pointer;background:none;border:none;color:var(--text-dim);}
.sort-btn:hover{color:var(--purple);}
.featured-card{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:20px;margin-bottom:20px;position:relative;display:grid;grid-template-columns:1fr 36px;gap:14px;align-items:start;cursor:pointer;}
.featured-card:hover .post-title{color:#ede8ff;}
</style>
</head>
<body>
<div id="nav-root"></div>
<div class="page-body" style="grid-template-columns:1fr;">
  <main class="main">
    <div class="feed-wrap" style="margin:0 auto;">
      <div class="filter-bar">
        <span class="filter-label">filter ·</span>
        <span class="pill active-filter" id="pill-all" onclick="setFilter('all')">all</span>
        <span class="pill pill-systems" id="pill-systems" onclick="setFilter('systems')">#systems</span>
        <span class="pill pill-dsa" id="pill-dsa" onclick="setFilter('dsa')">#dsa</span>
        <span class="pill pill-rant" id="pill-rant" onclick="setFilter('rant')">#rant</span>
        <span class="pill pill-daily-log" id="pill-daily-log" onclick="setFilter('daily-log')">#daily-log</span>
        <span class="pill pill-milestone" id="pill-milestone" onclick="setFilter('milestone')">#milestone</span>
        <input class="search-input" placeholder="search..." id="searchInput" oninput="doSearch()"/>
      </div>
      <div class="results-bar">
        <div class="results-count">showing <span id="countEl">0</span> posts</div>
        <button class="sort-btn" onclick="toggleSort()">sort: <span id="sortLabel">newest</span> ↕</button>
      </div>
      <div id="featured-root"></div>
      <div class="divider" id="all-label"><span class="div-label">all posts</span><div class="div-line"></div></div>
      <div id="list-root"></div>
    </div>
  </main>
</div>
<script src="/assets/js/main.js"></script>
<script>
let allPosts=[], activeFilter='all', sortAsc=false;

async function init(){
  document.getElementById('nav-root').innerHTML = renderNav('blog');
  allPosts = await fetchPosts();
  const params = new URLSearchParams(location.search);
  const tag = params.get('tag');
  if(tag) setFilter(tag);
  else render();
}

function setFilter(cat){
  activeFilter=cat;
  document.querySelectorAll('.filter-bar .pill').forEach(p=>p.classList.remove('active-filter'));
  const el=document.getElementById(`pill-${cat}`);
  if(el){
    el.classList.add('active-filter');
    // color the active pill
    const cls=el.className;
  }
  render();
}

function doSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  render(q);
}

function toggleSort(){
  sortAsc=!sortAsc;
  document.getElementById('sortLabel').textContent=sortAsc?'oldest':'newest';
  render();
}

function render(searchQ=''){
  let posts=allPosts.filter(p=>p.published);
  if(activeFilter!=='all') posts=posts.filter(p=>p.category===activeFilter||p.tags.includes(activeFilter));
  if(searchQ) posts=posts.filter(p=>p.title.toLowerCase().includes(searchQ)||p.excerpt.toLowerCase().includes(searchQ));
  posts=posts.sort((a,b)=>sortAsc?a.date.localeCompare(b.date):b.date.localeCompare(a.date));

  document.getElementById('countEl').textContent=posts.length;

  // featured = first post
  const featRoot=document.getElementById('featured-root');
  const allLabel=document.getElementById('all-label');
  if(posts.length){
    const f=posts[0];
    featRoot.innerHTML=`
      <div class="tape"></div>
      <div class="featured-card" onclick="location='/post.html?id=${f.id}'">
        <div>
          <div class="post-tag tc-${f.category}">// ${f.category}</div>
          <div class="post-title" style="font-family:var(--font-serif);font-style:italic;font-size:19px;color:var(--text-primary);line-height:1.25;margin-bottom:8px;">${f.title}</div>
          <div class="about-prose" style="font-size:10px;margin-bottom:10px;">${f.excerpt}</div>
          <div class="post-meta"><span>${formatDate(f.date)}</span><span>${f.readTime} min read</span></div>
        </div>
        ${getMoodGhost(f.mood,28,32)}
      </div>`;
    featRoot.style.display='block';
    allLabel.style.display='flex';
  } else {
    featRoot.innerHTML='';
    allLabel.style.display='none';
  }

  // list = rest
  const rest=posts.slice(1);
  document.getElementById('list-root').innerHTML=rest.map((p,i)=>{
    const isCard=p.category==='dsa'||p.category==='rant';
    const inner=`
      <div class="post-tag tc-${p.category}">// ${p.category}</div>
      <div class="post-title">${p.title}</div>
      <div class="post-meta"><span>${formatDate(p.date)}</span><span>${p.readTime} min read</span></div>`;
    return `
    <div class="post-item" onclick="location='/post.html?id=${p.id}'">
      <div class="post-num">${String(i+2).padStart(2,'0')}</div>
      ${isCard?`<div class="card-wrap card-${p.category}"><div class="tape${p.category==='rant'?' tape-pink':''}"></div>${inner}</div>`:`<div>${inner}</div>`}
      ${getMoodGhost(p.mood,22,26)}
    </div>`;
  }).join('');

  if(!posts.length){
    document.getElementById('list-root').innerHTML=`
      <div style="text-align:center;padding:40px;">
        ${GHOST.exhausted(40,46)}
        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-top:12px;">no posts found</div>
      </div>`;
  }
}

init();
</script>
</body>
</html>
