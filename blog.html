<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="nav-root"></div>
<div class="nav-spacer"></div>
<main class="main" style="max-width:900px;margin:0 auto;">
  <div class="filter-bar" id="filterBar">
    <span class="filter-label">filter ·</span>
    <span class="pill active-filter" id="pill-all" onclick="setFilter('all',this)">all</span>
    <input class="search-input" placeholder="search..." id="searchInput" oninput="doSearch()"/>
  </div>
  <div class="results-bar">
    <div class="results-count">showing <span id="countEl">0</span> posts</div>
    <button class="sort-btn" onclick="toggleSort()">sort: <span id="sortLabel">newest</span> ↕</button>
  </div>
  <div class="feed-grid" id="feedRoot"></div>
</main>
</div>
<script src="/assets/js/main.js"></script>
<script>
let allPosts=[],allTags=[],activeFilter='all',sortAsc=false;

async function init(){
  document.getElementById('nav-root').innerHTML=renderNav('blog');
  [allPosts,allTags]=await Promise.all([fetchPosts(),fetchTags()]);

  // build filter pills from tags
  const cats=allTags.filter(t=>t.isCategory);
  const fb=document.getElementById('filterBar');
  cats.forEach(t=>{
    const span=document.createElement('span');
    span.className='pill';
    span.id='pill-'+t.id;
    span.style.color=t.color;
    span.style.borderColor=t.color+'55';
    span.style.background=t.bg;
    span.textContent='#'+t.label;
    span.onclick=()=>setFilter(t.id,span);
    fb.insertBefore(span,document.getElementById('searchInput'));
  });

  const params=new URLSearchParams(location.search);
  const tag=params.get('tag');
  if(tag){const el=document.getElementById('pill-'+tag);setFilter(tag,el||null);}
  else render();
  initStars();
}

function setFilter(cat,el){
  activeFilter=cat;
  document.querySelectorAll('.filter-bar .pill').forEach(p=>p.classList.remove('active-filter'));
  if(el)el.classList.add('active-filter');
  render();
}
function doSearch(){render(document.getElementById('searchInput').value.toLowerCase());}
function toggleSort(){sortAsc=!sortAsc;document.getElementById('sortLabel').textContent=sortAsc?'oldest':'newest';render();}

async function render(q=''){
  let posts=allPosts.filter(p=>p.published);
  if(activeFilter!=='all')posts=posts.filter(p=>p.category===activeFilter||p.tags?.includes(activeFilter));
  if(q)posts=posts.filter(p=>p.title.toLowerCase().includes(q)||p.excerpt?.toLowerCase().includes(q));
  posts.sort((a,b)=>sortAsc?a.date.localeCompare(b.date):b.date.localeCompare(a.date));
  document.getElementById('countEl').textContent=posts.length;
  if(!posts.length){document.getElementById('feedRoot').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px;font-family:var(--font-mono);font-size:12px;color:var(--t4);">${G.exhausted(44,50)}<br><br>no posts found</div>`;return;}
  const [first,...rest]=posts;
  const firstCard=await renderPostCard(first,first.pinned);
  const restCards=await Promise.all(rest.map(p=>renderPostCard(p,p.pinned)));
  document.getElementById('feedRoot').innerHTML=`<div class="feed-featured">${firstCard}</div>`+restCards.join('');
}
init();
</script>
</body>
</html>
