<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="nav-root"></div>
<div class="page-body">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="hero" id="heroRoot">
      <div class="hero-accountability">// accountability blog</div>
      <div class="hero-vol">vol. 1</div>
      <div class="hero-h1">learning arc or<br>villain origin<br>story.</div>
      <div class="chaos-zone" id="chaosZone"></div>
    </div>

    <div id="pinned-root"></div>
    <div class="divider"><span class="div-label">recent</span><div class="div-line"></div></div>
    <div class="cards-grid" id="posts-root"></div>
  </main>
</div>
</div>

<script src="/assets/js/main.js"></script>
<script>
const CHAOS_QUOTES = [
  {t:'error 404: consistency not found',r:1.5,x:'6px',y:4},
  {t:'sudo make me consistent',r:-2,x:'28px',y:24},
  {t:'this will make sense eventually (threat)',r:1,x:'4px',y:46},
  {t:'gaslighting myself into understanding',r:-1.5,x:'20px',y:66},
  {t:"ctrl + z but for life pls",r:2,x:'6px',y:86},
  {t:"trust the process (i don't)",r:-1,x:'24px',y:106},
  {t:'skill issue (fixing)',r:1.2,x:'4px',y:122},
  {t:'one concept away from clarity',r:-1.8,x:'30px',y:140},
];

async function init(){
  document.getElementById('nav-root').innerHTML = renderNav();

  const posts = await fetchPosts();

  // sidebar
  const about = await fetchAbout();
  document.getElementById('sidebar-root').innerHTML = await renderSidebar(posts, about.moods||['exhausted','uglycrying']);

  // chaos quotes animated
  const zone = document.getElementById('chaosZone');
  zone.innerHTML = CHAOS_QUOTES.map(q=>`
    <div class="chaos-q" style="right:${q.x};top:${q.y}px;transform:rotate(${q.r}deg);" data-r="${q.r}" data-y="${q.y}">${q.t}</div>
  `).join('');
  initChaosAnimation();

  // pinned
  const pinned = posts.filter(p=>p.pinned&&p.published);
  if(pinned.length){
    document.getElementById('pinned-root').innerHTML = `
      <div class="divider"><span class="div-label">📌 pinned</span><div class="div-line"></div></div>
      <div class="cards-grid">${pinned.map(p=>renderPostCard(p,true)).join('')}</div>
      <div style="margin-bottom:24px;"></div>`;
  }

  // recent (not pinned)
  const recent = posts.filter(p=>p.published&&!p.pinned).slice(0,6);
  document.getElementById('posts-root').innerHTML = recent.map(p=>renderPostCard(p)).join('');

  // admin bar
  if(isAdmin()){
    document.querySelector('.page-wrap').insertAdjacentHTML('afterbegin',`
      <div class="admin-bar">
        <span class="admin-bar-label">// admin mode active</span>
        <a href="/admin.html" class="adm-btn btn-save" style="text-decoration:none;">open admin →</a>
        <button class="adm-btn" onclick="adminLogout();location.reload();" style="background:var(--bg2);color:var(--t3);border:1px solid var(--border);">logout</button>
      </div>`);
  }

  initStars();
}
init();
</script>
</body>
</html>
