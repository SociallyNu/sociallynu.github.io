<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="nav-root"></div>
<div class="nav-spacer"></div>
<div class="page-body">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="hero">
      <div class="hero-top">
        <div class="hero-text">
          <div class="hero-accountability">// accountability blog</div>
          <div class="hero-vol">vol. 1</div>
          <div class="hero-h1">learning arc or<br>villain origin<br>story.</div>
        </div>
        <div class="hero-nuon float" id="heroNuon"></div>
      </div>
      <div class="ticker-zone" id="tickerZone"></div>
    </div>
    <div id="pinned-root"></div>
    <div class="divider"><span class="div-label">recent</span><div class="div-line"></div></div>
    <div class="cards-grid" id="posts-root"></div>
  </main>
</div>
<!-- mobile sidebar toggle button -->
<button onclick="toggleMobileSidebar()" style="display:none;position:fixed;bottom:20px;left:20px;z-index:160;width:44px;height:44px;border-radius:50%;background:var(--purple-dark);border:1px solid var(--purple);color:var(--purple);font-size:18px;cursor:pointer;align-items:center;justify-content:center;" id="mobileSbBtn">≡</button>
</div>
<script src="/assets/js/main.js"></script>
<script>
async function init(){
  document.getElementById('nav-root').innerHTML=renderNav();
  // show mobile sidebar btn
  const btn=document.getElementById('mobileSbBtn');
  if(window.innerWidth<=900){btn.style.display='flex';}
  window.addEventListener('resize',()=>{btn.style.display=window.innerWidth<=900?'flex':'none';});

  const [posts,about,tags]=await Promise.all([fetchPosts(),fetchAbout(),fetchTags()]);

  document.getElementById('sidebar-root').innerHTML=await renderSidebar(posts,about.moods);
  initMobileSidebar();
  applyPfp([document.getElementById('pfpEl')]);

  // hero nuon
  document.getElementById('heroNuon').innerHTML=G.base(120,138);

  // tickers
  initTickers('tickerZone');

  // pinned
  const pinned=posts.filter(p=>p.pinned&&p.published);
  if(pinned.length){
    const cards=await Promise.all(pinned.map(p=>renderPostCard(p,true)));
    document.getElementById('pinned-root').innerHTML=`
      <div class="divider"><span class="div-label">📌 pinned</span><div class="div-line"></div></div>
      <div class="cards-grid">${cards.join('')}</div>
      <div style="margin-bottom:24px;"></div>`;
  }

  // recent
  const recent=posts.filter(p=>p.published&&!p.pinned).slice(0,6);
  const recentCards=await Promise.all(recent.map(p=>renderPostCard(p)));
  document.getElementById('posts-root').innerHTML=recentCards.join('')||`<div style="grid-column:1/-1;text-align:center;padding:40px;font-family:var(--font-mono);font-size:12px;color:var(--t4);">no posts yet — go write something 👻</div>`;

  if(isAdmin()){
    document.querySelector('.page-wrap').insertAdjacentHTML('afterbegin',`<div class="admin-bar"><span class="admin-bar-label">// admin mode</span><a href="/admin.html" class="adm-btn btn-save" style="text-decoration:none;">open admin →</a><button class="adm-btn" onclick="adminLogout();location.reload();" style="background:var(--bg2);color:var(--t3);border:1px solid var(--border);">logout</button></div>`);
  }
  initStars();
}
init();
</script>
</body>
</html>
