<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="admin-bar-root"></div>
<div id="nav-root"></div>

<div class="post-layout">
  <aside class="post-sidebar" id="postSidebar">
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">←</button>
    <div class="sb-inner" id="sbInner">
      <div id="postNuonRoot"></div>
      <div class="sb-sep" style="margin:4px 0;"></div>
      <div id="tocRoot"></div>
      <div class="sb-sep" style="margin:4px 0;"></div>
      <div id="postTagsRoot"></div>
    </div>
  </aside>

  <main class="post-main">
    <div class="post-main-inner" id="postMain">
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--t4);padding:40px 0;">loading...</div>
    </div>
  </main>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="/assets/js/main.js"></script>
<script>
let collapsed=false;
function toggleSidebar(){
  collapsed=!collapsed;
  document.getElementById('postSidebar').classList.toggle('collapsed',collapsed);
  document.getElementById('toggleBtn').textContent=collapsed?'→':'←';
}

async function init(){
  document.getElementById('nav-root').innerHTML = renderNav('blog');
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(!id){location='/blog.html';return;}

  const allPosts = await fetchPosts();
  const meta = allPosts.find(p=>p.id===id);
  if(!meta){location='/blog.html';return;}

  const post = await fetchPost(meta.file);
  document.title = `${post.title} — SociallyNu.`;

  // admin bar
  if(isAdmin()){
    document.getElementById('admin-bar-root').innerHTML=`
      <div class="admin-bar">
        <span class="admin-bar-label">// admin mode — only you see this</span>
        <a href="/admin.html?edit=${post.id}" class="adm-btn btn-save" style="text-decoration:none;">edit post</a>
        <button class="adm-btn" onclick="unpublishPost('${post.id}')" style="background:var(--bg2);color:var(--t3);border:1px solid var(--border);">unpublish</button>
        <button class="adm-btn btn-del" onclick="deletePost('${post.id}')">delete</button>
      </div>`;
  }

  // sidebar nuon — post's mood ghost
  document.getElementById('postNuonRoot').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;">
      <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;">reading along</div>
      <div class="float">${getMoodGhost(post.mood,52,60)}</div>
      <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--purple);text-transform:uppercase;font-weight:700;">${post.mood} nuon</div>
    </div>`;

  // pub sorted list for prev/next
  const pub = allPosts.filter(p=>p.published).sort((a,b)=>b.date.localeCompare(a.date));
  const idx = pub.findIndex(p=>p.id===id);
  const prev = pub[idx+1]||null;
  const next = pub[idx-1]||null;

  // post body
  document.getElementById('postMain').innerHTML=`
    <div class="breadcrumb">
      <a href="/blog.html">blog</a> → <a href="/blog.html?tag=${post.category}">#${post.category}</a> → ${post.title.slice(0,45)}${post.title.length>45?'...':''}
    </div>
    <div class="post-header-tag tc-${post.category}">// ${post.category}</div>
    <div class="post-header-title">${post.title}</div>
    <div class="post-header-meta">
      <span class="meta-item">${formatDate(post.date)}</span>
      <span class="meta-item">${post.readTime} min read</span>
      <span class="meta-item">${post.tags?.map(t=>`#${t}`).join(' ')||''}</span>
      <span style="display:flex;align-items:center;gap:5px;">${getMoodGhost(post.mood,22,26)}<span class="meta-item">${post.mood}</span></span>
    </div>
    <div class="post-content" id="postContent">${post.content||''}</div>
    <div class="post-footer">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
        ${(post.tags||[post.category]).map(t=>`<span class="pill pill-${t}" onclick="location='/blog.html?tag=${t}'" style="cursor:pointer;">#${t}</span>`).join('')}
      </div>
      <div class="post-nav">
        ${prev?`<div class="post-nav-card" onclick="location='/post.html?id=${prev.id}'">
          <div class="post-nav-label">← previous</div>
          <div class="post-nav-title">${prev.title}</div>
        </div>`:` <div></div>`}
        ${next?`<div class="post-nav-card" style="text-align:right;" onclick="location='/post.html?id=${next.id}'">
          <div class="post-nav-label">next →</div>
          <div class="post-nav-title">${next.title}</div>
        </div>`:''}
      </div>
    </div>`;

  // syntax highlight + katex
  Prism.highlightAllUnder(document.getElementById('postContent'));
  document.querySelectorAll('.katex-src').forEach(el=>{
    try{katex.render(el.textContent,el,{displayMode:el.classList.contains('katex-display'),throwOnError:false});}catch(e){}
  });

  // TOC
  buildTOC();

  // tags sidebar
  const allCounts = {};
  allPosts.filter(p=>p.published).forEach(p=>{allCounts[p.category]=(allCounts[p.category]||0)+1;});
  const cats=['systems','dsa','rant','daily-log','milestone'];
  document.getElementById('postTagsRoot').innerHTML=`
    <div class="sb-label">core dumps</div>
    ${cats.map(c=>`
      <div class="tag-row" onclick="location='/blog.html?tag=${c}'">
        <span class="tag-name tc-${c}">#${c}</span>
        <span class="tag-count">${String(allCounts[c]||0).padStart(2,'0')}</span>
      </div>`).join('')}`;

  initStars();
}

function buildTOC(){
  const content = document.getElementById('postContent');
  if(!content) return;
  const headings = content.querySelectorAll('h1,h2,h3');
  if(!headings.length){document.getElementById('tocRoot').innerHTML='';return;}
  let n=1;
  const items = Array.from(headings).map(h=>{
    const hid=`h-${n}`; h.id=hid;
    const cls = h.tagName==='H3'?' h3':'';
    return `<div class="toc-item${cls}" onclick="document.getElementById('${hid}').scrollIntoView({behavior:'smooth'})">
      <span class="toc-num">${String(n++).padStart(2,'0')}</span>${h.textContent.slice(0,42)}
    </div>`;
  });
  document.getElementById('tocRoot').innerHTML=`
    <div class="sb-label">in this post</div>
    <div>${items.join('')}</div>`;

  // active TOC highlight on scroll
  const observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.toc-item').forEach(i=>i.classList.remove('active'));
        const idx = Array.from(headings).indexOf(e.target);
        document.querySelectorAll('.toc-item')[idx]?.classList.add('active');
      }
    });
  },{rootMargin:'-10% 0px -60% 0px'});
  headings.forEach(h=>observer.observe(h));
}

async function deletePost(id){
  if(!confirm('delete this post permanently?')) return;
  const allPosts = await fetchPosts();
  const newIndex = allPosts.filter(p=>p.id!==id);
  const ok1 = await githubSave('posts/index.json',newIndex,'delete post '+id);
  const ok2 = await githubDelete(`posts/${id}.json`,'delete post file '+id);
  if(ok1){alert('deleted!');location='/blog.html';}
  else alert('delete failed — check GitHub token');
}

async function unpublishPost(id){
  const allPosts = await fetchPosts();
  const idx = allPosts.findIndex(p=>p.id===id);
  if(idx<0) return;
  allPosts[idx].published=false;
  const ok = await githubSave('posts/index.json',allPosts,'unpublish post '+id);
  if(ok){alert('unpublished!');location='/blog.html';}
}

init();
</script>
</body>
</html>
