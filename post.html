<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="admin-bar-root"></div>
<div id="nav-root"></div>
<div class="nav-spacer"></div>
<div class="post-layout">
  <aside class="post-sidebar" id="postSidebar">
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">←</button>
    <div class="sb-inner" id="sbInner">
      <div id="postNuonRoot"></div>
      <div class="sb-sep" style="margin:6px 0;"></div>
      <div id="tocRoot"></div>
      <div class="sb-sep" style="margin:6px 0;"></div>
      <div id="postTagsRoot"></div>
    </div>
  </aside>
  <main class="post-main">
    <div class="post-main-inner" id="postMain">
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--t4);padding:60px 0 0;text-align:center;">loading post...</div>
    </div>
  </main>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="/assets/js/main.js"></script>
<script>
let collapsed=false;
function toggleSidebar(){collapsed=!collapsed;document.getElementById('postSidebar').classList.toggle('collapsed',collapsed);document.getElementById('toggleBtn').textContent=collapsed?'→':'←';}

async function init(){
  document.getElementById('nav-root').innerHTML=renderNav('blog');
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){location='/blog.html';return;}
  const [allPosts,tags]=await Promise.all([fetchPosts(),fetchTags()]);
  const meta=allPosts.find(p=>p.id===id);
  if(!meta||!meta.published){location='/blog.html';return;}

  let post;
  try{post=await fetchPost(meta.file);}
  catch(e){document.getElementById('postMain').innerHTML='<div style="padding:40px;font-family:var(--font-mono);font-size:12px;color:var(--pink);">error loading post. file may not exist yet.</div>';return;}

  document.title=`${post.title} — SociallyNu.`;
  const tag=await getTag(post.category);

  if(isAdmin()){
    document.getElementById('admin-bar-root').innerHTML=`<div class="admin-bar"><span class="admin-bar-label">// admin mode</span><a href="/admin.html?edit=${post.id}" class="adm-btn btn-save" style="text-decoration:none;">edit post</a><button class="adm-btn" onclick="unpublishPost('${post.id}')" style="background:var(--bg2);color:var(--t3);border:1px solid var(--border);">unpublish</button><button class="adm-btn btn-del" onclick="deletePost('${post.id}')">delete</button></div>`;
  }

  document.getElementById('postNuonRoot').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;">
    <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--t4);text-transform:uppercase;">reading along</div>
    <div class="float" style="display:flex;align-items:center;justify-content:center;">${getMoodGhost(post.mood,64,74)}</div>
    <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--purple);text-transform:uppercase;font-weight:700;">${post.mood} nuon</div>
    <div style="font-family:var(--font-mono);font-size:8px;color:var(--t4);text-align:center;line-height:1.5;">emotional support<br>ghostling</div>
  </div>`;

  const pub=allPosts.filter(p=>p.published).sort((a,b)=>b.date.localeCompare(a.date));
  const idx=pub.findIndex(p=>p.id===id);
  const prev=pub[idx+1]||null,next=pub[idx-1]||null;

  document.getElementById('postMain').innerHTML=`
    <div class="breadcrumb"><a href="/blog.html">blog</a> → <a href="/blog.html?tag=${post.category}" style="color:${tag.color};">#${post.category}</a> → ${post.title.slice(0,45)}${post.title.length>45?'...':''}</div>
    <div class="post-header-tag" style="color:${tag.color};">// ${post.category}</div>
    <div class="post-header-title">${post.title}</div>
    <div class="post-header-meta">
      <span class="meta-item">${formatDate(post.date)}</span>
      <span class="meta-item">${post.readTime} min read</span>
      <span class="meta-item">${(post.tags||[]).map(t=>`#${t}`).join(' ')}</span>
      <span style="display:flex;align-items:center;gap:5px;">${getMoodGhost(post.mood,22,26)}<span class="meta-item">${post.mood}</span></span>
    </div>
    <div class="post-content" id="postContent">${post.content||''}</div>
    <div class="post-footer">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">${(post.tags||[post.category]).map(t=>`<span class="pill" style="color:${tag.color};border-color:${tag.color}55;background:${tag.bg};" onclick="location='/blog.html?tag=${t}'">#${t}</span>`).join('')}</div>
      <div class="post-nav">
        ${prev?`<div class="post-nav-card" onclick="location='/post.html?id=${prev.id}'"><div class="post-nav-label">← previous</div><div class="post-nav-title">${prev.title}</div></div>`:'<div></div>'}
        ${next?`<div class="post-nav-card" style="text-align:right;" onclick="location='/post.html?id=${next.id}'"><div class="post-nav-label">next →</div><div class="post-nav-title">${next.title}</div></div>`:''}
      </div>
    </div>`;

  // add lang badge to code blocks
  document.querySelectorAll('#postContent pre code').forEach(c=>{
    const lang=(c.className.match(/language-(\w+)/)||[])[1];
    if(lang){const b=document.createElement('span');b.className='code-lang-badge';b.textContent=lang;c.parentElement.appendChild(b);}
  });

  // strip contenteditable, fix code blocks, run prism
  const pc=document.getElementById('postContent');
  pc.querySelectorAll('[contenteditable]').forEach(el=>el.removeAttribute('contenteditable'));
  // fix pre blocks: strip font tags, ensure code tag with language class exists
  pc.querySelectorAll('pre').forEach(pre=>{
    // strip font tags
    pre.querySelectorAll('font').forEach(f=>{const t=document.createTextNode(f.textContent);f.replaceWith(t);});
    pre.querySelectorAll('[style]').forEach(el=>el.removeAttribute('style'));
    // get language from badge
    const badge=pre.querySelector('.code-lang-badge');
    const lang=badge?badge.textContent.trim().toLowerCase():'';
    let code=pre.querySelector('code');
    if(!code){
      // no code tag - wrap content in one
      const nodes=Array.from(pre.childNodes).filter(n=>!n.classList?.contains('code-lang-badge'));
      const text=nodes.map(n=>n.textContent).join('').trim();
      pre.innerHTML='';
      code=document.createElement('code');
      code.textContent=text;
      if(lang)code.className='language-'+lang;
      pre.appendChild(code);
      if(badge)pre.appendChild(badge);
    } else if(lang&&!code.className.includes('language-')){
      code.className='language-'+lang;
    }
  });
  // load specific language files then highlight
  const usedLangs=[...new Set([...pc.querySelectorAll('code[class*="language-"]')].map(c=>(c.className.match(/language-(\w+)/)||[])[1]).filter(Boolean))];
  function runHighlight(){if(window.Prism)Prism.highlightAllUnder(pc);}
  if(!usedLangs.length){runHighlight();return;}
  let loaded=0;
  usedLangs.forEach(lang=>{
    if(window.Prism&&Prism.languages[lang]){loaded++;if(loaded===usedLangs.length)runHighlight();return;}
    const s=document.createElement('script');
    s.src=`https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-${lang}.min.js`;
    s.onload=s.onerror=()=>{loaded++;if(loaded===usedLangs.length)runHighlight();};
    document.head.appendChild(s);
  });
  // render latex blocks
  // render all latex blocks from data-latex attribute
  if(window.katex){
    document.querySelectorAll('#postContent .latex-block[data-latex]').forEach(el=>{
      const expr=el.getAttribute('data-latex');
      if(!expr)return;
      try{katex.render(expr,el,{displayMode:true,throwOnError:false,trust:true});}
      catch(e){el.innerHTML=`<span style="font-family:monospace;color:#d4c5fa;font-size:12px;">∑ ${expr}</span>`;}
    });
    // also render any katex-src spans (legacy)
    document.querySelectorAll('#postContent .katex-src').forEach(el=>{
      try{katex.render(el.textContent,el,{displayMode:el.classList.contains('katex-display'),throwOnError:false});}catch(e){}
    });
  }
  document.querySelectorAll('.katex-src').forEach(el=>{try{katex.render(el.textContent,el,{displayMode:el.classList.contains('katex-display'),throwOnError:false});}catch(e){}});

  buildTOC();

  const allCounts={};allPosts.filter(p=>p.published).forEach(p=>{allCounts[p.category]=(allCounts[p.category]||0)+1;});
  const catTags=tags.filter(t=>t.isCategory);
  document.getElementById('postTagsRoot').innerHTML=`<div class="sb-label">core dumps</div>${catTags.map(t=>`<div class="tag-row" onclick="location='/blog.html?tag=${t.id}'"><span class="tag-name" style="color:${t.color};">#${t.label}</span><span class="tag-count">${String(allCounts[t.id]||0).padStart(2,'0')}</span></div>`).join('')}`;

  initStars();
}

function buildTOC(){
  const content=document.getElementById('postContent');
  if(!content)return;
  // only grab headings that are DIRECT children of post-content, not inside blockquotes/tables
  const allH=content.querySelectorAll('h1,h2,h3,h4,h5,h6');
  const headings=Array.from(allH).filter(h=>{
    // exclude if inside blockquote or table
    let p=h.parentElement;
    while(p&&p!==content){
      if(p.tagName==='BLOCKQUOTE'||p.tagName==='TABLE'||p.tagName==='TD'||p.tagName==='TH')return false;
      p=p.parentElement;
    }
    return true;
  });
  if(!headings.length){document.getElementById('tocRoot').innerHTML='';return;}
  
  // H1=level1, H2=level2, H3=level3, H4=level4, H5=level5, H6=level6
  // indent increases with each level from H1
  const levelMap={'H1':1,'H2':2,'H3':3,'H4':4,'H5':5,'H6':6};
  const indentPx={1:0,2:10,3:20,4:28,5:34,6:38};
  const fontSz={1:11,2:11,3:10,4:10,5:9,6:9};
  const opacityMap={1:1,2:0.9,3:0.8,4:0.7,5:0.6,6:0.55};

  let n=1;
  const items=headings.map(h=>{
    const hid=`toc-h-${n}`;h.id=hid;
    const lvl=levelMap[h.tagName]||1;
    const pl=indentPx[lvl];
    const fs=fontSz[lvl];
    const op=opacityMap[lvl];
    const style=`padding-left:${pl}px;font-size:${fs}px;opacity:${op};`;
    return `<div class="toc-item" style="${style}" onclick="document.getElementById('${hid}').scrollIntoView({behavior:'smooth'})">
      <span class="toc-num">${String(n++).padStart(2,'0')}</span>
      <span class="toc-text">${h.textContent.slice(0,36)}</span>
    </div>`;
  });
  document.getElementById('tocRoot').innerHTML=`<div class="sb-label">in this post</div>${items.join('')}`;
  
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.toc-item').forEach(i=>i.classList.remove('active'));
        const i=headings.indexOf(e.target);
        document.querySelectorAll('.toc-item')[i]?.classList.add('active');
      }
    });
  },{rootMargin:'-10% 0px -60% 0px'});
  headings.forEach(h=>observer.observe(h));
}

async function deletePost(id){
  if(!confirm('delete permanently?'))return;
  const allPosts=await fetchPosts();
  const newIndex=allPosts.filter(p=>p.id!==id);
  const ok=await githubSave('posts/index.json',newIndex,'delete post '+id);
  await githubDelete(`posts/${id}.json`,'delete post file');
  if(ok){alert('deleted!');location='/blog.html';}else alert('failed — check GitHub token');
}
async function unpublishPost(id){
  const allPosts=await fetchPosts();
  const idx=allPosts.findIndex(p=>p.id===id);
  if(idx<0)return;
  allPosts[idx].published=false;
  const ok=await githubSave('posts/index.json',allPosts,'unpublish '+id);
  if(ok){alert('unpublished!');location='/blog.html';}
}
init();
</script>
</body>
</html>
