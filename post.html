<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
.post-layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 47px);}
.post-sidebar{border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto;transition:width 0.25s;}
.post-sidebar.collapsed{width:32px;padding:10px 6px;}
.post-sidebar.collapsed .sb-inner{display:none;}
.toggle-btn{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:3px 6px;cursor:pointer;align-self:flex-end;}
.toc-item{font-family:var(--font-mono);font-size:7px;padding:4px 0;border-bottom:1px solid #0a0d18;color:var(--text-muted);cursor:pointer;display:flex;gap:5px;line-height:1.4;}
.toc-item:hover,.toc-item.active{color:var(--purple);}
.toc-item.h3{padding-left:10px;font-size:6.5px;}
.toc-num{color:var(--text-dim);flex-shrink:0;}
.post-main{padding:28px 36px;max-width:680px;}
.breadcrumb{font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-bottom:16px;letter-spacing:1px;}
.breadcrumb a{color:var(--text-muted);}
.breadcrumb a:hover{color:var(--purple);}
.post-header-tag{font-family:var(--font-mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.post-header-title{font-family:var(--font-serif);font-style:italic;font-size:24px;color:#ede8ff;line-height:1.2;margin-bottom:12px;}
.post-header-meta{display:flex;gap:12px;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #0a0d18;flex-wrap:wrap;}
.meta-item{font-family:var(--font-mono);font-size:7px;color:var(--text-dim);letter-spacing:1px;}
.post-footer{margin-top:28px;padding-top:16px;border-top:1px solid #0a0d18;}
.post-nav{display:flex;justify-content:space-between;gap:12px;margin-top:16px;}
.post-nav-card{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px;cursor:pointer;}
.post-nav-card:hover{border-color:var(--border2);}
.post-nav-label{font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;}
.post-nav-title{font-family:var(--font-serif);font-size:11px;color:var(--text-muted);line-height:1.35;}
.admin-bar{background:#0d0a1e;border-bottom:1px solid #2a1f4a;padding:6px 20px;display:flex;align-items:center;gap:8px;}
.admin-bar-label{font-family:var(--font-mono);font-size:7px;color:#3a2f6a;flex:1;}
</style>
</head>
<body>
<div id="admin-bar-root"></div>
<div id="nav-root"></div>
<div class="post-layout" id="postLayout">
  <aside class="post-sidebar" id="postSidebar">
    <button class="toggle-btn" id="toggleBtn" onclick="toggleSidebar()">←</button>
    <div class="sb-inner" id="sbInner">
      <div class="nuon-wrap" id="postNuonRoot"></div>
      <div id="tocRoot"></div>
      <div id="postTagsRoot"></div>
    </div>
  </aside>
  <main class="post-main" id="postMain"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="/assets/js/main.js"></script>
<script>
let collapsed=false;
function toggleSidebar(){
  collapsed=!collapsed;
  document.getElementById('postSidebar').classList.toggle('collapsed',collapsed);
  document.getElementById('toggleBtn').textContent=collapsed?'→':'←';
}

async function init(){
  document.getElementById('nav-root').innerHTML=renderNav('blog');
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  if(!id){location='/blog.html';return;}

  const allPosts=await fetchPosts();
  const meta=allPosts.find(p=>p.id===id);
  if(!meta){location='/blog.html';return;}

  const post=await fetchPost(meta.file);
  document.title=`${post.title} — SociallyNu.`;

  // admin bar
  if(isAdmin()){
    document.getElementById('admin-bar-root').innerHTML=`
      <div class="admin-bar">
        <div class="admin-bar-label">// admin mode — only you see this</div>
        <a href="/admin.html?edit=${post.id}" class="adm-btn btn-save">edit post</a>
        <button class="adm-btn" onclick="unpublishPost('${post.id}')" style="background:#0a0c18;color:var(--text-muted);border:1px solid var(--border);">unpublish</button>
        <button class="adm-btn btn-del" onclick="deletePost('${post.id}')">delete</button>
      </div>`;
  }

  // sidebar nuon (post's mood)
  document.getElementById('postNuonRoot').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <div style="font-family:var(--font-mono);font-size:7px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;">reading alongside</div>
      <div class="float">${getMoodGhost(post.mood,48,56)}</div>
      <div class="nuon-name" style="font-size:8px;">nuon · ${post.mood}</div>
    </div>`;

  // main content
  const idx=allPosts.filter(p=>p.published).findIndex(p=>p.id===id);
  const pub=allPosts.filter(p=>p.published);
  const prev=pub[idx+1]||null;
  const next=pub[idx-1]||null;

  document.getElementById('postMain').innerHTML=`
    <div class="breadcrumb">
      <a href="/blog.html">blog</a> → <a href="/blog.html?tag=${post.category}">#${post.category}</a> → ${post.title.slice(0,40)}...
    </div>
    <div class="post-header-tag tc-${post.category}">// ${post.category}</div>
    <div class="post-header-title">${post.title}</div>
    <div class="post-header-meta">
      <span class="meta-item">${formatDate(post.date)}</span>
      <span class="meta-item">${post.readTime} min read</span>
      <span class="meta-item">${post.tags.map(t=>`#${t}`).join(' ')}</span>
      <span style="display:flex;align-items:center;gap:4px;">${getMoodGhost(post.mood,18,20)}<span class="meta-item">${post.mood}</span></span>
    </div>
    <div class="post-content" id="postContent">${post.content}</div>
    <div class="post-footer">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">
        ${post.tags.map(t=>`<span class="${getPillClass(post.category)}" onclick="location='/blog.html?tag=${t}'">#${t}</span>`).join('')}
      </div>
      <div class="post-nav">
        ${prev?`<div class="post-nav-card" onclick="location='/post.html?id=${prev.id}'">
          <div class="post-nav-label">← previous</div>
          <div class="post-nav-title">${prev.title}</div>
        </div>`:` <div></div>`}
        ${next?`<div class="post-nav-card" style="text-align:right;" onclick="location='/post.html?id=${next.id}'">
          <div class="post-nav-label">next →</div>
          <div class="post-nav-title">${next.title}</div>
        </div>`:''}
      </div>
    </div>`;

  // syntax highlight
  Prism.highlightAllUnder(document.getElementById('postContent'));

  // katex render
  document.querySelectorAll('.katex-src').forEach(el=>{
    try{katex.render(el.textContent,el,{displayMode:el.classList.contains('katex-display'),throwOnError:false});}catch(e){}
  });

  // build TOC
  buildTOC();

  // tags sidebar
  const allCounts={};
  allPosts.filter(p=>p.published).forEach(p=>{allCounts[p.category]=(allCounts[p.category]||0)+1;});
  document.getElementById('postTagsRoot').innerHTML=`
    <div>
      <div class="sb-label">core dumps</div>
      ${['systems','dsa','rant','daily-log','milestone'].map(c=>`
        <div class="tag-row" onclick="location='/blog.html?tag=${c}'">
          <span class="tag-name tc-${c}">#${c}</span>
          <span class="tag-count">${String(allCounts[c]||0).padStart(2,'0')}</span>
        </div>`).join('')}
    </div>`;
}

function buildTOC(){
  const content=document.getElementById('postContent');
  const headings=content.querySelectorAll('h1,h2,h3');
  if(!headings.length){document.getElementById('tocRoot').innerHTML='';return;}
  let n=1;
  const items=Array.from(headings).map(h=>{
    const id=`h-${n}`;h.id=id;
    const lvl=h.tagName==='H3'?'h3':'';
    const label=`<span class="toc-num">${String(n++).padStart(2,'0')}</span>${h.textContent.slice(0,40)}`;
    return `<div class="toc-item ${lvl}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${label}</div>`;
  });
  document.getElementById('tocRoot').innerHTML=`
    <div><div class="sb-label">in this post</div>${items.join('')}</div>`;

  // active TOC on scroll
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        document.querySelectorAll('.toc-item').forEach(i=>i.classList.remove('active'));
        const active=document.querySelector(`.toc-item:nth-child(${Array.from(headings).indexOf(e.target)+1})`);
        if(active) active.classList.add('active');
      }
    });
  },{rootMargin:'-20% 0px -60% 0px'});
  headings.forEach(h=>observer.observe(h));
}

async function deletePost(id){
  if(!confirm('delete this post permanently?')) return;
  const allPosts=await fetchPosts();
  const meta=allPosts.find(p=>p.id===id);
  // delete post file
  const postRes=await fetch(`/posts/${id}.json`);
  const postData=await postRes.json();
  // update index
  const newIndex=allPosts.filter(p=>p.id!==id);
  const saved=await githubSave('posts/index.json',newIndex,'delete post '+id);
  if(saved){alert('deleted!');location='/blog.html';}
}

async function unpublishPost(id){
  const allPosts=await fetchPosts();
  const idx=allPosts.findIndex(p=>p.id===id);
  if(idx<0) return;
  allPosts[idx].published=false;
  const saved=await githubSave('posts/index.json',allPosts,'unpublish post '+id);
  if(saved){alert('unpublished!');location='/blog.html';}
}

init();
</script>
</body>
</html>
