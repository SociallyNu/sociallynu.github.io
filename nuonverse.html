<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuonverse — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.nv-hero{padding:24px 28px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.nv-hero-title{font-family:var(--font-serif);font-style:italic;font-size:22px;color:#ede8ff;line-height:1.2;margin-bottom:6px;}
.nv-hero-eyebrow{font-family:var(--font-mono);font-size:7px;letter-spacing:3px;color:var(--purple);text-transform:uppercase;margin-bottom:6px;}
.nv-hero-desc{font-family:var(--font-body);font-size:11px;color:var(--text-muted);line-height:1.7;max-width:420px;}
.nv-hero-ghosts{display:flex;gap:8px;align-items:flex-end;}
/* leader card - centered above grid */
.nv-leader-wrap{display:flex;justify-content:center;margin-bottom:20px;}
.nv-leader-card{background:#0d0a1e;border:1px solid #2a1f4a;border-radius:12px;padding:18px 24px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform 0.15s;min-width:160px;}
.nv-leader-card:hover{transform:translateY(-4px);}
.nv-leader-card:hover .nv-ghost-svg{animation:wobble 0.4s ease;}
.nv-leader-badge{font-family:var(--font-mono);font-size:6px;letter-spacing:2px;color:var(--purple);text-transform:uppercase;background:#1a1040;border:1px solid #2a1f4a;border-radius:3px;padding:2px 6px;margin-bottom:2px;}
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="main" style="max-width:900px;margin:0 auto;">
  <div class="nv-hero">
    <div>
      <div class="nv-hero-eyebrow">∵ the nuonverse</div>
      <div class="nv-hero-title">meet the ghost council.</div>
      <div class="nv-hero-desc">every emotion has a ghostling. they float through this blog, appearing when the moment calls. hover to wake them up.</div>
    </div>
    <div class="nv-hero-ghosts" id="heroGhosts"></div>
  </div>

  <!-- LEADER: NUON centered -->
  <div class="nv-leader-wrap">
    <div class="nv-leader-card">
      <div class="nv-leader-badge">leader</div>
      <div class="float" id="nuonLeader"></div>
      <div class="nv-card-name">nuon</div>
      <div class="nv-card-mood">soft floaty · base</div>
    </div>
  </div>

  <!-- CORE COUNCIL -->
  <div class="divider"><span class="div-label">core council</span><div class="div-line"></div></div>
  <div class="nv-grid" id="coreGrid" style="margin-bottom:24px;"></div>

  <!-- BONUS -->
  <div class="nv-bonus-divider">
    <div class="nv-bonus-line"></div>
    <div class="nv-bonus-text">bonus council · spotted occasionally</div>
    <div class="nv-bonus-line"></div>
  </div>
  <div class="nv-grid" id="bonusGrid"></div>
</div>

function renderGhostCard(g, size=44, isBonus=false){
  return `
  <div class="nv-card${isBonus?' bonus':''}">
    <div>${g.svg(size, Math.round(size*1.15))}</div>
    <div class="nv-card-name" style="${isBonus?'font-size:7px;':''}">${g.name}</div>
    <div class="nv-card-mood">${g.mood}</div>
  </div>`;
}

async function init(){
  document.getElementById('nav-root').innerHTML=renderNav('nuonverse');

  // hero ghost trio
  document.getElementById('heroGhosts').innerHTML=`
    <div class="float">${GHOST.base(38,44)}</div>
    ${GHOST.frustrated(28,34)}
    ${GHOST.uglycrying(24,28)}`;

  // leader
  document.getElementById('nuonLeader').innerHTML=GHOST.base(56,64);

  // core grid
  document.getElementById('coreGrid').innerHTML=CORE_COUNCIL.map(g=>renderGhostCard(g,44)).join('');

  // bonus grid
  document.getElementById('bonusGrid').innerHTML=BONUS_COUNCIL.map(g=>renderGhostCard(g,36,true)).join('');
}
init();
