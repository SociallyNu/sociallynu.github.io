<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuonverse — SociallyNu.</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<canvas id="starCanvas"></canvas>
<div class="page-wrap">
<div id="nav-root"></div>
<div class="nv-page-body">
  <main class="nv-main">

    <div class="divider" style="margin-top:0;">
      <div style="width:4px;height:4px;border-radius:50%;background:var(--purple);flex-shrink:0;"></div>
      <span class="div-label" style="color:var(--purple);">∵ the nuonverse</span>
      <div class="div-line"></div>
    </div>

    <div style="font-family:var(--font-serif);font-style:italic;font-size:22px;color:var(--t1);margin-bottom:24px;">meet the ghost council.</div>

    <!-- LEADER: NUON centered -->
    <div class="nv-leader-wrap">
      <div class="nv-leader-card">
        <div class="nv-leader-badge">leader</div>
        <div class="float" id="nuonLeader"></div>
        <div class="nv-card-name">nuon</div>
        <div class="nv-card-mood">soft floaty · base</div>
      </div>
    </div>

    <!-- ALL GHOSTS IN ONE GRID -->
    <div class="nv-grid" id="nvGrid"></div>

  </main>

  <!-- SIDEBAR -->
  <aside class="nv-sidebar" id="nvSidebarEl">
    <div class="nuon-wrap" style="margin-bottom:8px;">
      <div class="float" id="nvSideNuon"></div>
      <div class="nuon-name">nuon</div>
      <div class="nuon-role">leader of the nuonverse<br>emotional support ghostling</div>
    </div>
    <div class="sb-sep"></div>
    <div id="nvTagsRoot"></div>
    <div class="sb-sep"></div>
    <div>
      <div class="sb-label">ghost count</div>
      <div style="font-family:var(--font-mono);font-size:24px;color:var(--purple);font-weight:700;text-align:center;padding:8px 0;" id="ghostCount">0</div>
      <div style="font-family:var(--font-mono);font-size:9px;color:var(--t4);text-align:center;letter-spacing:1px;text-transform:uppercase;">floating through<br>the nuonverse</div>
    </div>
  </aside>
</div>
</div>

<script src="/assets/js/main.js"></script>
<script>
const ALL_GHOSTS = [
  {id:'crash', name:'CrashNuon', mood:"the \"i can't even\" ghost", fn:(w,h)=>G.crash(w,h)},
  {id:'cry', name:'CryNuon', mood:'sad but relatable', fn:(w,h)=>G.uglycrying(w,h)},
  {id:'loop', name:'LoopNuon', mood:'obsessive · grind mode', fn:(w,h)=>G.loop(w,h)},
  {id:'glitch', name:'GlitchNuon', mood:'pure chaos', fn:(w,h)=>G.glitch(w,h)},
  {id:'null', name:'NullNuon', mood:'apathetic · meh', fn:(w,h)=>G.null(w,h)},
  {id:'bug', name:'BugNuon', mood:'comic relief · trolling', fn:(w,h)=>G.bug(w,h)},
  {id:'trace', name:'TraceNuon', mood:'reflective · learning', fn:(w,h)=>G.trace(w,h)},
  {id:'oops', name:'OopsNuon', mood:'minor disasters', fn:(w,h)=>G.oops(w,h)},
  {id:'lag', name:'LagNuon', mood:'sleepy · burnt-out', fn:(w,h)=>G.lag(w,h)},
  {id:'gremlin', name:'GremlinNuon', mood:'trolling · chaos', fn:(w,h)=>G.gremlin(w,h)},
  {id:'blink', name:'BlinkNuon', mood:'random · motivational', fn:(w,h)=>G.blink(w,h)},
];

async function init(){
  document.getElementById('nav-root').innerHTML = renderNav('nuonverse');

  // leader
  document.getElementById('nuonLeader').innerHTML = G.base(60,68);
  document.getElementById('nvSideNuon').innerHTML = G.base(52,60);

  // all ghosts grid
  document.getElementById('nvGrid').innerHTML = ALL_GHOSTS.map(g=>`
    <div class="nv-card">
      <div>${g.fn(48,56)}</div>
      <div class="nv-card-name">${g.name}</div>
      <div class="nv-card-mood">${g.mood}</div>
    </div>`).join('');

  document.getElementById('ghostCount').textContent = ALL_GHOSTS.length + 1;

  // sidebar tags
  const posts = await fetchPosts();
  const counts={};
  posts.filter(p=>p.published).forEach(p=>{counts[p.category]=(counts[p.category]||0)+1;});
  const cats=['systems','dsa','rant','daily-log','milestone'];
  document.getElementById('nvTagsRoot').innerHTML=`
    <div class="sb-label">core dumps</div>
    ${cats.map(c=>`
      <div class="tag-row" onclick="location='/blog.html?tag=${c}'">
        <span class="tag-name tc-${c}">#${c}</span>
        <span class="tag-count">${String(counts[c]||0).padStart(2,'0')}</span>
      </div>`).join('')}`;

  initStars();
}
init();
</script>
</body>
</html>
